name: Alerta Segura — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio para el GITHUB_TOKEN en todos los jobs.
permissions:
  contents: read

# Un solo pipeline de main a la vez: dos deploys cruzados romperían el smoke test.
# En PRs sí se cancela la ejecución anterior para ahorrar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.21.2"   # verificar última estable y fijarla
  TRIVY_VERSION: "0.58.0"      # verificar última estable y fijarla
  # La etiqueta stable se reconstruye sin aviso y Docker usa el digest. Dependabot
  # no actualiza imágenes dentro de un docker run, así que el digest se renueva a
  # mano con `docker buildx imagetools inspect ghcr.io/zaproxy/zaproxy:stable`.
  ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238"

jobs:
  # ─────────────────────────── CI ───────────────────────────
  calidad:
    name: Tests + chequeo de despliegue Django
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-not-a-secret
      DATABASE_URL: postgres://alerta:alerta@localhost:5432/alerta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Crear el rol de la app sin superusuario (igual que en Neon)
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -U postgres -v ON_ERROR_STOP=1 < scripts/init_postgres.sql
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migraciones completas
        run: python manage.py makemigrations --check --dry-run
      - name: Tests y cobertura (pytest contra PostgreSQL real, mínimo en pyproject.toml)
        run: pytest --cov
      - name: Chequeo de seguridad de Django (check --deploy)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: ci.example
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as g; print(g())')"
          python manage.py check --deploy --fail-level WARNING

  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar herramientas (versiones de requirements-dev.txt)
        run: pip install -r requirements-dev.txt
      - name: Bandit (severidad y confianza media o alta)
        run: bandit -r . -x ./tests,./.venv -ll -ii
      - name: Semgrep (reglas Python + Django)
        run: semgrep scan --config p/python --config p/django --error --metrics=off

  dependencias:
    name: Supply chain (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Auditar dependencias contra vulnerabilidades conocidas
        run: |
          pip install -r requirements-dev.txt
          pip-audit -r requirements.txt

  secretos:
    name: Secretos (gitleaks, historial completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # todo el historial: un secreto borrado sigue en commits viejos
      - name: Instalar gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Escanear
        run: ./gitleaks detect --source . --redact --verbose

  imagen:
    name: Build Docker + escaneo (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagen
        run: docker build -t alerta-segura:ci .
      # Va antes del escaneo porque, si Trivy encuentra una CVE, el job se corta
      # y el SBOM tiene que quedar en todas las ejecuciones.
      - name: Generar SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/sbom" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --format cyclonedx --output /sbom/sbom.cdx.json \
            alerta-segura:ci
      - name: Guardar SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom/sbom.cdx.json
          retention-days: 30
      - name: Escanear vulnerabilidades HIGH/CRITICAL con parche disponible
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            alerta-segura:ci

  # ─────────────────────────── CD ───────────────────────────
  deploy-dev:
    name: Deploy a Dev
    needs: [calidad, sast, dependencias, secretos, imagen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.APP_URL }}
    steps:
      - name: Disparar deploy en Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy a Dev disparado"

  smoke-dev:
    name: Smoke test en Dev
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Esperar la versión nueva y validarla
        run: bash scripts/smoke.sh "${{ vars.APP_URL }}" "${{ github.sha }}"

  dast-dev:
    name: DAST (OWASP ZAP baseline) contra Dev
    needs: smoke-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # -I: las advertencias solo avisan. Las reglas FAIL de .github/zap-rules.tsv
      # detienen el pipeline, y con él el despliegue automático a producción.
      - name: Escaneo pasivo con ZAP
        run: |
          mkdir -p zap && chmod 777 zap
          cp .github/zap-rules.tsv zap/
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "${{ vars.APP_URL }}" -c zap-rules.tsv \
            -r zap-report.html -J zap-report.json -I
      - name: Publicar reporte como evidencia
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report-${{ github.sha }}
          path: zap/
          retention-days: 30

  deploy-prod:
    name: Deploy a Producción
    needs: dast-dev
    runs-on: ubuntu-latest
    environment:
      name: production          # sin aprobación manual: solo llega aquí si Dev pasó smoke test y DAST
      url: ${{ vars.APP_URL }}
    steps:
      - name: Disparar deploy en Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy a Prod disparado"

  smoke-prod:
    name: Smoke test en Prod
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Esperar la versión nueva y validarla
        run: bash scripts/smoke.sh "${{ vars.APP_URL }}" "${{ github.sha }}"