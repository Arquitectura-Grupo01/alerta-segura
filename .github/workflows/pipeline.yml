name: Alerta Segura — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio para el GITHUB_TOKEN en todos los jobs.
permissions:
  contents: read

# Un solo pipeline de main a la vez: dos deploys cruzados romperían el smoke test.
# En PRs sí se cancela la ejecución anterior para ahorrar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.21.2"   # verificar última estable y fijarla
  TRIVY_VERSION: "0.58.0"      # verificar última estable y fijarla

jobs:
  # ─────────────────────────── CI ───────────────────────────
  calidad:
    name: Tests + chequeo de despliegue Django
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alerta_test
          POSTGRES_USER: alerta
          POSTGRES_PASSWORD: alerta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alerta"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-not-a-secret
      DATABASE_URL: postgres://alerta:alerta@localhost:5432/alerta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migraciones completas
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (pytest contra PostgreSQL real)
        run: pytest
      - name: Chequeo de seguridad de Django (check --deploy)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: ci.example
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as g; print(g())')"
          python manage.py check --deploy --fail-level WARNING

  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar herramientas
        run: pip install bandit semgrep
      - name: Bandit (severidad y confianza media o alta)
        run: bandit -r . -x ./tests,./.venv -ll -ii
      - name: Semgrep (reglas Python + Django)
        run: semgrep scan --config p/python --config p/django --error --metrics=off

  dependencias:
    name: Supply chain (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Auditar dependencias contra vulnerabilidades conocidas
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  secretos:
    name: Secretos (gitleaks, historial completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # todo el historial: un secreto borrado sigue en commits viejos
      - name: Instalar gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Escanear
        run: ./gitleaks detect --source . --redact --verbose

  imagen:
    name: Build Docker + escaneo (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t alerta-segura:ci .
      - name: Escanear vulnerabilidades HIGH/CRITICAL con parche disponible
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            alerta-segura:ci

  # ─────────────────────────── CD ───────────────────────────
  deploy-dev:
    name: Deploy a Dev
    needs: [calidad, sast, dependencias, secretos, imagen]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.APP_URL }}
    steps:
      - name: Disparar deploy en Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy a Dev disparado"

  smoke-dev:
    name: Smoke test en Dev
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Esperar la versión nueva y validarla
        run: bash scripts/smoke.sh "${{ vars.APP_URL }}" "${{ github.sha }}"

  dast-dev:
    name: DAST (OWASP ZAP baseline) contra Dev
    needs: smoke-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Escaneo pasivo con ZAP
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ vars.APP_URL }}" -r zap-report.html -J zap-report.json -I
      - name: Publicar reporte como evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ github.sha }}
          path: zap/
          retention-days: 30

  deploy-prod:
    name: Deploy a Producción (aprobación manual)
    needs: dast-dev
    runs-on: ubuntu-latest
    environment:
      name: production          # tiene "required reviewers": el job espera aprobación
      url: ${{ vars.APP_URL }}
    steps:
      - name: Disparar deploy en Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy a Prod disparado"

  smoke-prod:
    name: Smoke test en Prod
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Esperar la versión nueva y validarla
        run: bash scripts/smoke.sh "${{ vars.APP_URL }}" "${{ github.sha }}"