# Solo para desarrollo local. Levanta lo que en la nube vive en servicios separados.
services:
  db:
    image: postgres:16-alpine
    # El superusuario "postgres" solo administra. La app entra con el rol "alerta",
    # sin superusuario, que crea scripts/init_postgres.sql la primera vez que se
    # inicializa el volumen.
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    healthcheck:
      # -h localhost fuerza TCP: durante la inicialización Postgres solo escucha
      # por socket local y el rol "alerta" todavía no existe.
      test: ["CMD-SHELL", "pg_isready -h localhost -U alerta -d alerta"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DATABASE_URL: postgres://alerta:alerta@db:5432/alerta
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://alerta:alerta@db:5432/alerta
      REDIS_URL: redis://redis:6379/0
    volumes: [".:/app"]
    depends_on: [db, redis]

volumes:
  pgdata: