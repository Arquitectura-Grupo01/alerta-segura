# Solo para desarrollo local. Levanta lo que en la nube vive en servicios separados.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alerta
      POSTGRES_USER: alerta
      POSTGRES_PASSWORD: alerta
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerta"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      DATABASE_URL: postgres://alerta:alerta@db:5432/alerta
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://alerta:alerta@db:5432/alerta
      REDIS_URL: redis://redis:6379/0
    volumes: [".:/app"]
    depends_on: [db, redis]

volumes:
  pgdata: